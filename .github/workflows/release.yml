name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build zip + checksum
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate + archive (ad-hoc)
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild \
            -project DevAlias.xcodeproj \
            -scheme DevAlias \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES
          APP="build/DerivedData/Build/Products/Release/DevAlias.app"
          test -d "$APP"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/DevAlias.zip"
          shasum -a 256 "dist/DevAlias.zip" | tee dist/DevAlias.zip.sha256
          echo "NOTE: This artifact is ad-hoc signed. For Gatekeeper-friendly builds, run Scripts/notarize.sh with Developer ID secrets (see RELEASE.md)."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DevAlias-macos
          path: |
            dist/DevAlias.zip
            dist/DevAlias.zip.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DevAlias.zip
            dist/DevAlias.zip.sha256
          body: |
            ## DevAlias ${{ github.ref_name }}

            - `DevAlias.zip` — macOS Menu Bar app (ad-hoc signed unless notarized offline)
            - `DevAlias.zip.sha256` — checksum

            See [RELEASE.md](RELEASE.md) for Developer ID / notarization.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
